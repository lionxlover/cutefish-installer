<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- The Cutefish Installer's own icon, in the icons theme's own language:
       the blue gradient plate of system-software-install, with a drive and
       the arrow that fills it. -->
  <defs>
    <linearGradient id="plate" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#30a2f6"/>
      <stop offset="1" stop-color="#1d8ef3"/>
    </linearGradient>
    <linearGradient id="drive" x1="32" y1="20" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dceeff"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#plate)"/>

  <!-- The drive: a rounded box with the platter's dot -->
  <rect x="14" y="21" width="36" height="22" rx="4" fill="url(#drive)"/>
  <circle cx="32" cy="32" r="3.4" fill="#1d8ef3"/>
  <circle cx="32" cy="32" r="1.3" fill="#dceeff"/>

  <!-- The arrow, into the drive -->
  <path d="M32 8 L32 18 M27.5 13.5 L32 18 L36.5 13.5" stroke="#ffffff" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M23 18 H41" stroke="#ffffff" stroke-width="0" fill="none"/>

  <!-- The activity light, the installer at work -->
  <circle cx="21" cy="39" r="2" fill="#ffffff" opacity="0.85"/>
</svg>
